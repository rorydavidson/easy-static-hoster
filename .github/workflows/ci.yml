name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels the run still going for the previous one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: generator/requirements*.txt

      - name: Install dependencies
        run: pip install -r generator/requirements-dev.txt

      - name: Run tests
        working-directory: generator
        run: python -m pytest tests/ -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Shellcheck
        run: shellcheck nginx/entrypoint.sh generator/entrypoint.sh .github/scripts/*.sh

      - name: Validate compose files
        env:
          # Placeholders so the overlays' required-variable checks pass
          OIDC_ISSUER_URL: https://idp.example
          OIDC_CLIENT_ID: ci
          OIDC_CLIENT_SECRET: ci-placeholder
          COOKIE_SECRET: ci-placeholder-ci-placeholder-00
          OIDC_ALLOWED_GROUP: ci
          VIRTUAL_HOST: ci.example
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.nginx-proxy.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.oidc.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.oidc.yml \
                         -f docker-compose.oidc-nginx-proxy.yml config -q

  images:
    name: Build images and smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Tagged with the names docker-compose.yml expects, so the smoke test
      # runs these local builds rather than pulling from Docker Hub.
      # The generator build also runs the test suite in its test stage.
      - name: Build generator
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: generator
          load: true
          tags: rorydavidson/easy-static-hoster-generator:latest
          cache-from: type=gha,scope=generator
          cache-to: type=gha,mode=max,scope=generator

      - name: Build nginx
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: nginx
          load: true
          tags: rorydavidson/easy-static-hoster-nginx:latest
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

      - name: Check nginx config in every auth mode
        run: sh .github/scripts/check-nginx-modes.sh rorydavidson/easy-static-hoster-nginx:latest

      - name: Smoke test the stack
        run: sh .github/scripts/smoke-test.sh
