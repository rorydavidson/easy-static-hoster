worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Don't advertise nginx version in headers or error pages
    server_tokens off;

    # Temp paths writable by non-root nginx worker
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    sendfile on;
    keepalive_timeout 30;

    # Which proxies may set the client IP via X-Forwarded-For, so rate limiting
    # and logging see the real client. Written by entrypoint.sh from
    # TRUSTED_PROXIES; empty when nginx is exposed directly, because then any
    # client could send a fake X-Forwarded-For and dodge the rate limit.
    include /etc/nginx/real_ip.conf;

    # Rate limiting: 5 req/s per IP, burst up to 20.
    # Enough for fast human browsing; significantly impedes scrapers.
    limit_req_zone $binary_remote_addr zone=main:10m rate=5r/s;

    # Much tighter limit for the API, which checks credentials: about 10
    # password guesses a minute per IP instead of 5 a second.
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/m;
    limit_req_status 429;

    # Known AI training crawlers and aggressive scrapers.
    # These bots commonly ignore X-Robots-Tag / robots.txt, so we block
    # them actively. Matched case-insensitively against User-Agent.
    map $http_user_agent $blocked_bot {
        default             0;

        # OpenAI
        ~*GPTBot            1;
        ~*OAI-SearchBot     1;
        ~*ChatGPT-User      1;

        # Anthropic
        ~*ClaudeBot         1;
        ~*anthropic-ai      1;
        ~*Claude-Web        1;

        # Common Crawl (primary source for LLM training data)
        ~*CCBot             1;

        # Other AI / LLM companies
        ~*PerplexityBot     1;
        ~*cohere-ai         1;
        ~*AI2Bot            1;
        ~*YouBot            1;
        ~*Diffbot           1;

        # Aggressive commercial scrapers
        ~*Bytespider        1;
        ~*Amazonbot         1;
        ~*PetalBot          1;
        ~*omgili            1;
        ~*AhrefsBot         1;
        ~*SemrushBot        1;
        ~*MJ12bot           1;
        ~*DotBot            1;

        # Generic scraper libraries (rare in browsers, common in bots)
        ~*Scrapy            1;
        ~*python-httpx      1;
    }

    # Content-Security-Policy for the generated index page. It needs inline
    # script/style (the template is self-contained) but nothing external, so
    # an injected <script src> or exfiltration to another host is blocked.
    # Everything else gets the default from content_csp.conf (written by
    # entrypoint.sh): a sandbox for hosted pages on public sites, else empty.
    map $uri $page_csp {
        include         /etc/nginx/content_csp.conf;
        "/"             "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'";
        "/index.html"   "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'";
    }

    # Conceal detailed error messages
    proxy_intercept_errors on;

    log_format minimal '$remote_addr "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log minimal;

    server {
        listen 8080;
        server_name _;

        root  /content;
        index index.html;

        limit_req zone=main burst=20 nodelay;

        # Return 403 for known bots regardless of what they request
        if ($blocked_bot) { return 403; }

        # Security headers applied to all responses
        add_header X-Frame-Options        "SAMEORIGIN"                    always;
        add_header X-Content-Type-Options "nosniff"                       always;
        add_header X-XSS-Protection       "1; mode=block"                 always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag           "noindex, nofollow"             always;
        # nginx omits the header when the value is empty
        add_header Content-Security-Policy $page_csp                      always;

        # Optional global auth — global_auth.conf is written by entrypoint.sh;
        # it contains auth_basic directives when AUTH_GLOBAL=true, otherwise empty.
        include /etc/nginx/global_auth.conf;

        # Favicon — baked into the image, not served from the content volume
        location = /favicon.ico {
            alias /usr/share/nginx/favicon.ico;
            access_log off;
            expires 30d;
        }

        # Root: serve the generated index
        location = / {
            try_files /index.html =503;
        }

        # Short link redirects — proxied to the generator's redirect server
        location /s/ {
            proxy_pass         http://generator:5000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 5s;
        }

        # OIDC mode only: internal location that asks oauth2-proxy whether the
        # request's session cookie is valid. Empty in other modes.
        include /etc/nginx/oidc_auth_location.conf;

        # Upload endpoint — the generator validates credentials on every request
        # via the Authorization header (Basic Auth mode) or X-Forwarded-User/Email
        # (OIDC mode). api_auth.conf sets those identity headers from the
        # oauth2-proxy auth check, never from the client's own request.
        location = /api/upload {
            proxy_pass         http://generator:5000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            include            /etc/nginx/api_auth.conf;
            # Setting limit_req here replaces the server-level one, so repeat it
            limit_req          zone=main burst=20 nodelay;
            limit_req          zone=api  burst=10 nodelay;
            error_page         429 @api_rate_limited;
            proxy_read_timeout 30s;
        }

        # All other API calls (shortlinks, mkdir)
        location /api/ {
            proxy_pass         http://generator:5000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            include            /etc/nginx/api_auth.conf;
            # Setting limit_req here replaces the server-level one, so repeat it
            limit_req          zone=main burst=20 nodelay;
            limit_req          zone=api  burst=10 nodelay;
            error_page         429 @api_rate_limited;
            proxy_read_timeout 5s;
        }

        # JSON so the index page can show the message instead of "Network error"
        location @api_rate_limited {
            default_type application/json;
            return 429 '{"error":"too many attempts, wait a minute and try again"}';
        }

        # Instruct all crawlers to index nothing
        location = /robots.txt {
            add_header Content-Type "text/plain; charset=utf-8" always;
            add_header X-Robots-Tag "noindex, nofollow"         always;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        # ai.txt — emerging standard checked by some AI crawlers
        location = /ai.txt {
            add_header Content-Type "text/plain; charset=utf-8" always;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        # Block meta.json files from being served directly
        location ~* /meta\.json$ {
            return 404;
        }

        # Block dot-files (.htpasswd, .env, etc.)
        location ~ /\. {
            return 404;
        }

        # Everything else: serve as static file
        location / {
            try_files $uri =404;
        }

        # Minimal custom error pages (no nginx version in body)
        error_page 404 /404.html;
        location = /404.html {
            internal;
            return 404 "Not found\n";
        }

        error_page 503 /503.html;
        location = /503.html {
            internal;
            return 503 "Starting up, please retry\n";
        }
    }
}
